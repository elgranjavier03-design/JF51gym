<style>
:root{--steel:#101C25;--panel:#17262F;--panel-2:#1E3341;--line:#2C4756;--bone:#E9E5DA;

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--steel);color:var(--bone);font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:0 0 70px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#132029,#101C25);position:sticky;top:0;z-index:20}

.seg{flex:1;background:#1B2C36;border-top:1px solid #24404E}

.ticks{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:8.5px;color:#547083;margin-top:4px;letter-spacing:.1em}

nav{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}

.week-b{display:flex;align-items:center;gap:13px;padding:12px 13px}
.rir{flex:0 0 auto;text-align:center;border:1px solid var(--amber);padding:6px 11px;min-width:64px}

.ex{padding:12px 13px;border-bottom:1px solid #223744}

.ex.done{background:#16302B}
.ex-top{display:flex;align-items:flex-start;gap:10px}

.set{display:flex;align-items:center;gap:7px;margin-bottom:5px}

.set input{width:100%;background:#0D1820;border:1px solid var(--line);color:var(--bone);font-family:"IBM Plex Mono",monospace;font-size:15px;padding:7px 6px;text-align:right}
.set input:focus{outline:1px solid var(--amber);border-color:var(--amber)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.stat{padding:12px 10px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;color:var(--amber)}
.stat span{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.stat.green b{color:var(--ok)}

table{width:100%;border-collapse:collapse;font-family:"IBM Plex Mono",monospace;font-size:12px}
th{text-align:left;font-size:9px;letter-spacing:.13em;color:var(--dim);text-transform:uppercase;font-weight:500;padding:8px 13px;border-bottom:1px solid var(--line)}
td{padding:9px 13px;border-bottom:1px solid #223744}

.empty{padding:24px 13px;text-align:center;color:var(--dim);font-size:13px;line-height:1.5}

.plan-day{margin-bottom:6px}
.plan-day summary{cursor:pointer;padding:12px 13px;background:var(--panel-2);border:1px solid var(--line);font-family:"Barlow Condensed",sans-serif;font-size:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;list-style:none}
.plan-day summary::-webkit-details-marker{display:none}
.plan-day summary::before{content:"+";color:var(--amber);margin-right:9px;font-family:"IBM Plex Mono",monospace}
.plan-day[open] summary::before{content:"–"}
.plan-day ol{list-style:none;border:1px solid var(--line);border-top:0;background:var(--panel)}
.plan-day li{padding:10px 13px;border-bottom:1px solid #223744;font-size:13.5px;display:flex;justify-content:space-between;gap:12px}
.plan-day li:last-child{border-bottom:0}
.plan-day li em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--amber);white-space:nowrap}
.note{font-size:12.5px;color:var(--dim);line-height:1.6;padding:13px;border-left:2px solid var(--amber);background:#132029;margin-top:12px}
.note b{color:var(--bone)}
.vol{display:flex;justify-content:space-between;padding:8px 13px;border-bottom:1px solid #223744;font-size:13px}
.vol:last-child{border-bottom:0}
.vol em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ok)}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:22px;background:var(--amber);color:#101C25;padding:13px 20px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;letter-spacing:.09em;text-transform:uppercase;opacity:0;transition:.3s;pointer-events:none;z-index:50;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:520px){.brand{font-size:27px}.count b{font-size:22px}.day span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function nextDay(){
  if(!S.sessions.length) return 0;
  const ultima={};
  S.sessions.forEach(s=>{ if(!ultima[s.dia]||s.fecha>ultima[s.dia]) ultima[s.dia]=s.fecha; });
  let idx=0, peor=null;
  PLAN.forEach((p,i)=>{
    const f=ultima[p.id]||"0000-00-00";
    if(peor===null||f<peor){peor=f; idx=i;}
  });
  return idx;
}

const hoy=()=>new Date().toISOString().slice(0,10);
const fmt=d=>{const p=d.split("-");return p[2]+"/"+p[1];};
function semana(){const w=Math.floor((new Date(hoy())-new Date(INICIO))/6048e5);
  return {n:((w%4)+4)%4, ciclo:Math.floor(w/4)+1, abs:w+1};}
function fase(){const a=semana().abs; for(const f of FASES) if(a>=f[0]&&a<=f[1]) return f; return FASES[3];}

async function load(){
  let ok=true;
  try{const v=localStorage.getItem(KEY); if(v) S=Object.assign(S,JSON.parse(v));}catch(e){ok=false;}
  try{const v=localStorage.getItem(DKEY); if(v) D=JSON.parse(v);}catch(e){}
  window.__loadFailed=!ok;
  sugerido=nextDay(); sel=sugerido;
  if(ok) await save();

}

function marcarRespaldo(){try{localStorage.setItem("p52_lastBackup",hoy());}catch(e){}}
function diasSinRespaldo(){
  let lb=null; try{lb=localStorage.getItem("p52_lastBackup");}catch(e){}
  if(!lb) return null;
  return Math.floor((new Date(hoy())-new Date(lb))/864e5);

function descargarRespaldo(){
  const code=exportCode();
  if(!code){toast("No se pudo generar el respaldo");return;}
  const blob=new Blob([code],{type:"text/plain"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="proyecto52-backup-"+hoy()+".txt";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  marcarRespaldo();
  toast("Respaldo descargado");
}
async function importCode(str){
  try{
    const limpio=str.replace(/\s+/g,"");
    const obj=JSON.parse(decodeURIComponent(escape(atob(limpio))));
    S=Object.assign({sessions:[],metrics:[],habits:{},prog:{},alcohol:{}},obj);
    const ok=await save(); window.__loadFailed=false; sugerido=nextDay(); sel=sugerido; render();
    toast(ok?"Restaurado desde el código":"Restaurado en pantalla, pero no pudo guardarse");
  }catch(e){ toast("Código inválido — revisa que esté completo"); }
}

function tonSesion(s){
  if(s.kg!=null) return s.kg;
  if(s.ton!=null) return s.ton;
  return Math.round((s.detalle||[]).reduce((a,e)=>a+((e.peso||0)*(e.reps||0)*(e.series||0)),0));
}
function total(){let t=0;S.sessions.forEach(s=>t+=(s.pts||0));return t;}
function nivel(p){let c=NIVELES[0],n=null;
  for(let i=0;i<NIVELES.length;i++){if(p>=NIVELES[i][1]){c=NIVELES[i];n=NIVELES[i+1]||null;}}return {cur:c,nxt:n};}
function racha(){const d=[...new Set(S.sessions.map(s=>s.fecha))].sort().reverse();
  if(!d.length)return 0; let n=0,c=new Date(hoy());
  if(d[0]!==hoy())c.setDate(c.getDate()-1);
  for(;;){const k=c.toISOString().slice(0,10); if(d.includes(k)){n++;c.setDate(c.getDate()-1);}else break;}return n;}

/* ---- lee las series del borrador ---- */
function seriesDe(dia,i,nSets){
  const out=[];
  for(let j=0;j<nSets;j++){
    const kg=parseFloat(D[dia+"|k"+i+"_"+j]), rp=parseInt(D[dia+"|r"+i+"_"+j]);
    if(!isNaN(kg)&&!isNaN(rp)) out.push({kg:kg,reps:rp});
  }
  return out;
}
function hecho(dia,i,e){
  if(D[dia+"|c"+i]) return true;
  if(!e.p) return false;
  return seriesDe(dia,i,e.s).length>0;
}
/* ---- doble progresión: series al peso más alto ---- */
function resumen(sets){
  if(!sets.length) return null;
  const top=Math.max.apply(null,sets.map(s=>s.kg));
  const enTop=sets.filter(s=>s.kg===top);
  return {peso:top, reps:Math.min.apply(null,enTop.map(s=>s.reps)), series:enTop.length};
}
function objetivo(key,e){
  const p=S.prog[key]; if(!p) return null;
  if(p.reps>=e.b) return {tipo:"up",peso:+(p.peso+e.inc).toFixed(1),reps:e.a,prev:p};
  return {tipo:"hold",peso:p.peso,reps:Math.min(e.b,p.reps+1),prev:p};
}

  const ss=S.sessions.slice().reverse();
  let h='<div class="panel"><div class="panel-h"><h2>Historial</h2><div class="meta">'+ss.length+' sesiones</div></div></div>';
  if(!ss.length) return h+'<div class="empty">Todavía no hay ninguna sesión cerrada.</div>';
  ss.forEach((s,idx)=>{
    const p=PLAN.find(x=>x.id===s.dia);
    h+='<details class="plan-day"'+(idx===0?" open":"")+'><summary>'+(p?p.tag+" · "+p.name:s.dia)+' — '+fmt(s.fecha)+' · '+tonSesion(s).toLocaleString("es")+' kg</summary><ol>';
    const det=s.detalle||[];
    if(det.length) det.forEach(e=>{
      const et=e.ton!=null?e.ton:Math.round((e.peso||0)*(e.reps||0)*(e.series||0));
      h+='<li><span>'+e.ex+'</span><em>'+e.peso+' kg × '+e.reps+' · '+e.series+'x — '+et.toLocaleString("es")+' kg</em></li>';
    });

    h+='</ol></details>';
  });
  return h;
}

  let t="PROYECTO52 SYNC "+fmt(hoy())+"\n";
  t+="Nivel "+nv.cur[0]+" ("+total().toLocaleString("es")+" pts) · racha "+racha()+"d\n";
  t+="Peso "+m.peso+"kg (obj "+OBJ.peso+") · Cintura "+m.cintura+"cm (obj "+OBJ.cintura+")\n";
  t+="Últimas "+ss.length+" sesiones:\n";
  ss.forEach(s=>{
    const p=PLAN.find(x=>x.id===s.dia);
    t+="- "+fmt(s.fecha)+" "+(p?p.tag:s.dia)+" "+s.hechos+"/"+s.totalEx+" "+tonSesion(s).toLocaleString("es")+"kg"+(s.subidas?" +"+s.subidas+"prog":"")+"\n";
  });
  return t;
}
function genSyncUrl(){
  const code=genSync();
  const b64=btoa(unescape(encodeURIComponent(code)));
  const base=location.origin+location.pathname;
  return base+"?sync="+encodeURIComponent(b64);
}

  h+='<button class="btn sec" id="copySync" style="margin-top:10px">Copiar enlace</button>';
  return h;
}
function vMetricas(){

  const l=ms[ms.length-1], dP=(l.peso-BASE.peso).toFixed(1), dC=(l.cintura-BASE.cintura).toFixed(1), fP=(l.peso-OBJ.peso).toFixed(1);
  let h='<div class="panel"><div class="panel-h"><h2>Registro semanal</h2><div class="meta">domingo en ayunas</div></div><div class="panel-b">'+
   '<div class="mrow"><label><span>Peso (kg)</span><input type="number" step="0.1" id="mPeso" placeholder="'+l.peso+'"></label>'+
   '<label><span>Cintura (cm)</span><input type="number" step="0.5" id="mCint" placeholder="'+l.cintura+'"></label></div>'+
   '<button class="btn" id="guardarM">Guardar medición</button></div>'+
   '<div class="stats"><div class="stat'+(dP<=0?" green":"")+'"><b>'+(dP>0?"+":"")+dP+'</b><span>kg vs inicio</span></div>'+
   '<div class="stat'+(dC<=0?" green":"")+'"><b>'+(dC>0?"+":"")+dC+'</b><span>cm cintura</span></div>'+
   '<div class="stat"><b>'+fP+'</b><span>kg al objetivo</span></div></div></div>';
  h+='<div class="panel"><div class="panel-h"><h2>Evolución</h2><div class="meta">peso · cintura</div></div>'+chart(ms)+'</div>';
  h+='<div class="panel"><div class="panel-h"><h2>Historial</h2></div><table><tr><th>Fecha</th><th>Peso</th><th>Cintura</th></tr>';
  ms.slice().reverse().forEach(m=>h+='<tr><td>'+fmt(m.fecha)+'</td><td>'+m.peso+' kg</td><td>'+m.cintura+' cm</td></tr>');
  return h+'</table></div><div class="note"><b>Partida:</b> 92 kg · cintura 98 · 181 cm → ~24% de grasa.<br><b>12 semanas:</b> 84–85 kg y cintura en 90. Si el peso baja y las cargas también, estás perdiendo músculo: ahí se sube la comida.<br><b>Misma báscula, en ayunas, mismo día.</b></div>';
}

function chart(ms){
  if(ms.length<2) return '<div class="empty">Con una sola medición no hay línea todavía.</div>';
  const W=680,H=190,PX=34,PY=18, xs=ms.map((_,i)=>PX+i*(W-PX*2)/(ms.length-1));
  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block;padding:12px 0" role="img" aria-label="Evolución">';
  for(let g=0;g<4;g++){const y=PY+g*(H-PY*2)/3;svg+='<line x1="'+PX+'" y1="'+y+'" x2="'+(W-PX)+'" y2="'+y+'" stroke="#233A47"/>';}
  [["peso","#F2A423"],["cintura","#5FA8D3"]].forEach(function(pr){
    const k=pr[0],col=pr[1],vals=ms.map(m=>m[k]);
    const mn=Math.min.apply(null,vals)-1.5,mx=Math.max.apply(null,vals)+1.5;
    const y=v=>PY+(H-PY*2)*(1-(v-mn)/((mx-mn)||1));
    let d="";ms.forEach((m,i)=>d+=(i?" L":"M")+xs[i]+" "+y(m[k]));
    svg+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2"/>';
    ms.forEach((m,i)=>svg+='<circle cx="'+xs[i]+'" cy="'+y(m[k])+'" r="3" fill="'+col+'"/>');
    svg+='<text x="'+(W-PX+4)+'" y="'+(y(vals[vals.length-1])+4)+'" fill="'+col+'" font-family="IBM Plex Mono" font-size="11">'+vals[vals.length-1]+'</text>';});
  ms.forEach((m,i)=>{if(ms.length>8&&i%2)return;
    svg+='<text x="'+xs[i]+'" y="'+(H-2)+'" fill="#547083" font-family="IBM Plex Mono" font-size="9" text-anchor="middle">'+fmt(m.fecha)+'</text>';});
  return svg+'</svg>';
}

function vRituales(){
  const d=S.habits[hoy()]||{}, f=fase();
  let h='<div class="panel"><div class="panel-h"><h2>Hoy</h2><div class="meta">'+fmt(hoy())+'</div></div>';
  RITUALES.forEach(function(r){
    h+='<div class="hab'+(d[r[0]]?" on":"")+'" data-hab="'+r[0]+'" role="checkbox" tabindex="0" aria-checked="'+(d[r[0]]?"true":"false")+'">'+
     '<div class="tick" style="'+(d[r[0]]?"background:var(--ok);border-color:var(--ok);color:#0D1A16":"")+'">✓</div><b>'+r[1]+'</b><small>'+r[2]+'</small></div>';});
  h+='</div>';

  const sem=semana().abs, reg=S.alcohol[sem]||0;
  h+='<div class="panel"><div class="panel-h"><h2>Alcohol</h2><div class="meta">fase '+(FASES.indexOf(f)+1)+' · techo '+f[2]+'</div></div><div class="panel-b">'+
   '<div class="mrow"><label><span>Bebidas de este fin de semana</span><input type="number" id="alc" value="'+(reg||"")+'" placeholder="0"></label></div>'+
   '<button class="btn" id="guardarA">Registrar</button></div>'+

   '<div class="stat"><b>'+f[2]+'</b><span>techo fase</span></div>'+
   '<div class="stat"><b>60</b><span>punto de partida</span></div></div></div>';

  h+='<div class="panel"><div class="panel-h"><h2>Curva</h2></div><table><tr><th>Fase</th><th>Semanas</th><th style="text-align:right">Techo</th></tr>';
  FASES.forEach((x,i)=>h+='<tr'+(x===f?' style="color:var(--amber)"':'')+'><td>'+(i+1)+'</td><td>'+x[0]+'–'+x[1]+'</td><td style="text-align:right">'+x[2]+'</td></tr>');
  h+='</table></div>';

  const dias=Object.keys(S.habits).sort().reverse().slice(0,14);
  h+='<div class="panel"><div class="panel-h"><h2>Últimos 14 días</h2></div>';
  if(!dias.length)h+='<div class="empty">Sin registros todavía.</div>';
  else{h+='<table><tr><th>Fecha</th><th>Rituales</th><th style="text-align:right">Pts</th></tr>';
    dias.forEach(f2=>{const dd=S.habits[f2];
      const n=Object.keys(dd).filter(k=>dd[k]).length;
      const p=Object.keys(dd).reduce((a,k)=>a+(dd[k]?(RITUAL_PTS[k]||0):0),0);
      h+='<tr><td>'+fmt(f2)+'</td><td>'+n+'/7</td><td style="text-align:right;color:var(--amber)">+'+p+'</td></tr>';});
    h+='</table>';}
  h+='</div><div class="note"><b>Reglas fijas:</b> domingo en cero · solo viernes y sábado · nunca la noche antes de D3 o D5 · trago servido y contado, nunca botella asignada · un vaso de agua por bebida y cena con proteína antes.<br><br>Registra el mismo día. La memoria del lunes siempre miente a la baja.<br><br><b>Meta al 19 de septiembre:</b> tres fines de semana seguidos por debajo de 24.</div>';

  h+='<div class="panel" style="margin-top:14px"><div class="panel-h"><h2>Respaldo manual</h2></div><div class="panel-b">'+
   '<div class="note" style="margin:0 0 12px">El guardado usa el almacenamiento del navegador (localStorage) — vive solo en este teléfono, en este dominio. Si borras datos del sitio, cambias de navegador o de dominio, se pierde. Descarga el archivo cada tanto y guárdalo en Files/iCloud; es más seguro que solo copiar el texto.</div>'+
   '<button class="btn" id="descargarBk">Descargar respaldo (archivo)</button>'+
   '<button class="btn sec" id="expCode" style="margin-top:10px">Generar código de respaldo (texto)</button>'+
   '<textarea id="codeBox" readonly rows="4" style="width:100%;margin-top:8px;background:#0D1820;color:var(--bone);border:1px solid var(--line);font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;padding:8px;display:none"></textarea>'+
   '<div class="mrow" style="margin-top:14px"><label><span>Pegar código para restaurar</span><input type="text" id="impCode" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="pega aquí el código"></label></div>'+
   '<button class="btn sec" id="impBtn">Restaurar desde código</button>'+
   '</div></div>';
  return h;
}

function render(){paintHeader();document.getElementById("view").innerHTML=view();bind();}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),3000);}

function actualizaBoton(){
  const d=PLAN[sel];
  const n=d.ex.filter((e,i)=>hecho(d.id,i,e)).length;
  const c=document.getElementById("cnt"), b=document.getElementById("cerrar");
  if(c) c.textContent=n;
  if(b) b.disabled=(n===0);
  d.ex.forEach((e,i)=>{
    const el=document.querySelector('[data-ex="'+i+'"]');
    if(el) el.classList.toggle("done", hecho(d.id,i,e));
  });
}

function bind(){
  document.querySelectorAll("[data-day]").forEach(el=>el.onclick=()=>{sel=+el.dataset.day;render();});
  document.querySelectorAll("[data-check]").forEach(el=>{
    const go=()=>{const k=PLAN[sel].id+"|c"+el.dataset.check;
      D[k]=!D[k]; saveDraft(); render();};
    el.onclick=go; el.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();go();}};
  });
  document.querySelectorAll("[data-k]").forEach(el=>{
    el.oninput=()=>{D[PLAN[sel].id+"|k"+el.dataset.k]=el.value; saveDraft(); actualizaBoton();};});
  document.querySelectorAll("[data-r]").forEach(el=>{
    el.oninput=()=>{D[PLAN[sel].id+"|r"+el.dataset.r]=el.value; saveDraft(); actualizaBoton();};});
  const c=document.getElementById("cerrar"); if(c) c.onclick=cerrarSesion;
  const l=document.getElementById("limpiar"); if(l) l.onclick=limpiar;
  const rs=document.getElementById("reset"); if(rs) rs.onclick=resetProg;
  const g=document.getElementById("guardarM"); if(g) g.onclick=guardarMetrica;
  const a=document.getElementById("guardarA"); if(a) a.onclick=guardarAlcohol;
  const ec=document.getElementById("expCode"); if(ec) ec.onclick=()=>{
    const box=document.getElementById("codeBox");
    box.value=exportCode(); box.style.display="block"; box.focus(); box.select();
    marcarRespaldo();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(box.value).then(()=>toast("Copiado al portapapeles")).catch(()=>toast("Selecciona el texto y cópialo"));
    } else toast("Selecciona el texto y cópialo");
  };
  const dbk=document.getElementById("descargarBk"); if(dbk) dbk.onclick=descargarRespaldo;
  const ib=document.getElementById("impBtn"); if(ib) ib.onclick=()=>{
    const v=document.getElementById("impCode").value;
    if(!v.trim()){toast("Pega el código primero");return;}
    importCode(v);
  };
  const cs=document.getElementById("copySync"); if(cs) cs.onclick=()=>{
    const box=document.getElementById("syncBox");
    box.focus(); box.select();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(box.value).then(()=>toast("Copiado al portapapeles")).catch(()=>toast("Selecciona el texto y cópialo"));
    } else toast("Selecciona el texto y cópialo");
  };
  document.querySelectorAll("[data-hab]").forEach(el=>{
    const go=async()=>{const f=hoy();S.habits[f]=S.habits[f]||{};
      S.habits[f][el.dataset.hab]=!S.habits[f][el.dataset.hab];await save();render();};
    el.onclick=go; el.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();go();}};
  });
}

async function cerrarSesion(){
  const d=PLAN[sel], cfg=SEMANAS[semana().n];
  let pts=0,ton=0,hechos=0,subidas=0,detalle=[];
  d.ex.forEach((e,i)=>{
    if(!hecho(d.id,i,e)) return;
    hechos++; pts+=10;
    if(!e.p) return;
    const nS=cfg.deload&&e.s>2?2:e.s, sets=seriesDe(d.id,i,nS);
    const r=resumen(sets);
    if(!r) return;
    const exTon=Math.round(sets.reduce((a,s)=>a+s.kg*s.reps,0));
    ton+=exTon;
    detalle.push({ex:e.n,peso:r.peso,reps:r.reps,series:r.series,ton:exTon});
    if(cfg.deload) return;
    const key=d.id+"|"+i, ant=S.prog[key];
    if(ant&&(r.peso>ant.peso||(r.peso===ant.peso&&r.reps>ant.reps))){pts+=25;subidas++;}
    S.prog[key]={peso:r.peso,reps:r.reps,fecha:hoy()};
  });
  if(hechos===d.ex.length) pts+=50;
  pts=Math.round(pts*(1+Math.min(0.5,racha()*0.05)));
  ton=Math.round(ton);
  S.sessions.push({fecha:hoy(),dia:d.id,hechos:hechos,totalEx:d.ex.length,pts:pts,ton:ton,subidas:subidas,sem:semana().n+1,detalle:detalle});
  Object.keys(D).forEach(k=>{if(k.indexOf(d.id+"|")===0) delete D[k];});
  const ok=await save();
  try{localStorage.setItem(DKEY,JSON.stringify(D));}catch(e){}
  window.__loadFailed=!ok;
  sugerido=nextDay(); sel=sugerido;
  const antes=total()-pts, sube=nivel(antes).cur[0]!==nivel(total()).cur[0];
  render();
  const tonTxt=ton.toLocaleString("es")+" kg";
  if(!ok) toast(tonTxt+" movidos · ⚠ NO SE GUARDÓ — copia el respaldo en Rituales");
  else if(sube) toast("Nuevo nivel: "+nivel(total()).cur[0]);
  else if(subidas) toast(tonTxt+" movidos · "+subidas+" progresión"+(subidas>1?"es":""));
  else toast(tonTxt+" movidos · sesión guardada");
}

async function resetProg(){
  if(!confirm("Se borran las sesiones y las referencias de peso. Los rituales y las medidas se conservan. ¿Seguro?")) return;
  S.sessions=[]; S.prog={}; D={};
  const ok=await save(); try{localStorage.setItem(DKEY,JSON.stringify(D));}catch(e){}
  render(); toast(ok?"Listo · empieza limpio":"⚠ No se guardó el reinicio");
}
async function limpiar(){
  const d=PLAN[sel];
  Object.keys(D).forEach(k=>{if(k.indexOf(d.id+"|")===0) delete D[k];});
  try{localStorage.setItem(DKEY,JSON.stringify(D));}catch(e){}
  render(); toast("Día vaciado");
}
async function guardarMetrica(){
  const p=parseFloat(document.getElementById("mPeso").value), c=parseFloat(document.getElementById("mCint").value);
  if(isNaN(p)||isNaN(c)){toast("Faltan peso y cintura");return;}
  S.metrics=S.metrics.filter(m=>m.fecha!==hoy());
  S.metrics.push({fecha:hoy(),peso:p,cintura:c});
  const ok=await save();render();toast(ok?"Medición guardada":"⚠ No se guardó — copia el respaldo");
}
async function guardarAlcohol(){
  const v=parseInt(document.getElementById("alc").value);
  if(isNaN(v)){toast("Escribe un número");return;}
  S.alcohol[semana().abs]=v; const ok=await save(); render();
  const f=fase();
  if(!ok){toast("⚠ No se guardó — copia el respaldo");return;}
  toast(v<=f[2]?"Dentro del techo · "+v+"/"+f[2]:"Por encima del techo: "+v+"/"+f[2]);
}

document.querySelectorAll("nav button").forEach(b=>{
  b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");tab=b.dataset.tab;render();};});
load();
